# ci.yml — The ONLY workflow users see on PRs
#
# Contributors see 3 checks:
#   CI / Tests        (C++ + Python matrix inside)
#   CI / Code Quality (lint + typecheck + benchmark inside)
#   CI / Build        (wheel + sdist verification inside)
#
# All consolidated into ONE "CI" check for branch protection.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_reusable-tests.yml
    with:
      run-cpp: true
      run-python: true

  quality:
    name: Code Quality
    uses: ./.github/workflows/_reusable-quality.yml

  build:
    name: Build
    uses: ./.github/workflows/_reusable-build.yml


  ci-status:
    name: CI
    needs: [tests, quality, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Check all CI results
        run: |
          echo "=== CI Summary ==="
          echo "Tests:        ${{ needs.tests.result }}"
          echo "Code Quality: ${{ needs.quality.result }}"
          echo "Build:        ${{ needs.build.result }}"

          FAILED=false
          for result in "${{ needs.tests.result }}" "${{ needs.quality.result }}" "${{ needs.build.result }}"; do
            if [ "$result" == "failure" ] || [ "$result" == "cancelled" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" == "true" ]; then
            echo "::error::CI failed — check the logs above"
            exit 1
          fi
          echo "✅ All CI checks passed"
