name: Reusable Build Verify

on:
  workflow_call: {}

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: cp313
          - os: windows-latest
            python: cp313
          - os: macos-14
            python: cp313
          - os: ubuntu-latest
            python: cp310
          - os: ubuntu-latest
            python: cp314
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pip install cibuildwheel

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Build wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "${{ matrix.os == 'macos-14' && 'arm64' || 'x86_64' }}"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          CIBW_BUILD_FRONTEND: "build"
          CIBW_ENVIRONMENT: "CMAKE_BUILD_PARALLEL_LEVEL=2 MAX_JOBS=2"
          CIBW_ENVIRONMENT_MACOS: "CMAKE_BUILD_PARALLEL_LEVEL=2 MAX_JOBS=2 MACOSX_DEPLOYMENT_TARGET=10.14"
          CIBW_BEFORE_BUILD_LINUX: >
            pip install cmake==3.30.5 ninja==1.11.1.1 scikit-build-core==0.10.7 nanobind==2.4.0
          CIBW_BEFORE_BUILD_MACOS: >
            pip install cmake==3.30.5 ninja==1.11.1.1 scikit-build-core==0.10.7 nanobind==2.4.0
          CIBW_BEFORE_BUILD_WINDOWS: >
            pip install cmake==3.30.5 ninja==1.11.1.1 scikit-build-core==0.10.7 nanobind==2.4.0
          # Functional test wheel inside isolated Python env (not import-only)
          CIBW_TEST_COMMAND: "python -c \"import zedda as zd; p = zd.scan(r'{project}/tests/fixtures/regression/bom.csv'); assert p.num_rows > 0; print('Functional scan OK')\""
          CIBW_TEST_SKIP: "*-manylinux_aarch64 *-musllinux_aarch64"

      # External smoke-test only for cp313 (runner Python 3.13 matches the built wheel).
      # For cp310/cp314, CIBW_TEST_COMMAND above handles in-env testing.
      - name: Smoke-test wheel
        if: matrix.python == 'cp313'
        run: |
          pip install --no-index --no-deps --find-links wheelhouse zedda
          python -c "import zedda as zd; p = zd.scan('tests/fixtures/regression/bom.csv'); assert p.num_rows > 0; print(f'Functional test OK: {p.num_rows} rows')"

      - name: Check wheel contents
        run: |
          pip install check-wheel-contents
          check-wheel-contents wheelhouse/*.whl --ignore W002,W004,W007,W009,W010

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 7

  build-sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: pip install build scikit-build-core nanobind

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify sdist builds
        run: |
          pip install --no-binary zedda dist/zedda-*.tar.gz
          python -c "import zedda; print(f'zedda {zedda.__version__} OK from sdist')"

      - name: Check sdist size
        run: |
          SIZE=$(stat -c%s dist/zedda-*.tar.gz)
          if [ "$SIZE" -gt 10485760 ]; then
            echo "::error::Sdist is $((SIZE/1024/1024)) MB — exceeds 10 MB"
            exit 1
          fi
          echo "Sdist size: $((SIZE/1024)) KB — OK"

  build-status:
    name: Build Status
    needs: [build-wheels, build-sdist]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Check build results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "::error::One or more build jobs failed"
            exit 1
          fi
          echo "All builds passed"
